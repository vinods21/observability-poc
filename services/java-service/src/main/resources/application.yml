spring:
  application:
    name: ${SPRING_APPLICATION_NAME:java-service}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tracing_poc}}
    username: ${POSTGRES_USERNAME:${POSTGRES_USER:tracing}}
    password: ${POSTGRES_PASSWORD:tracing}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}}
      transport: http

info:
  app:
    name: ${spring.application.name}
    description: Java service for the distributed tracing POC

app:
  kotlin-service:
    base-url: ${KOTLIN_SERVICE_BASE_URL:http://localhost:8081}
    trace-path: ${KOTLIN_SERVICE_TRACE_PATH:/api/v1/traces/process}
