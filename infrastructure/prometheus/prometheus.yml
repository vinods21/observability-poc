global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: java-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - java-service:8080

  - job_name: kotlin-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - kotlin-service:8081
