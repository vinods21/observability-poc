services:
  postgres:
    image: postgres:16-alpine
    container_name: tracing-poc-postgres
    environment:
      POSTGRES_DB: tracing_poc
      POSTGRES_USER: tracing
      POSTGRES_PASSWORD: tracing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tracing-poc-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: tracing-poc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: tracing-poc-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4319:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    container_name: tracing-poc-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

volumes:
  postgres-data:
  minio-data:
