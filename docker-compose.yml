services:
  postgres:
    image: postgres:16-alpine
    container_name: tracing-poc-postgres
    environment:
      POSTGRES_DB: tracing_poc
      POSTGRES_USER: tracing
      POSTGRES_PASSWORD: tracing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracing -d tracing_poc"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tracing-poc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tracing-poc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: tracing-poc-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4319:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    container_name: tracing-poc-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  kotlin-service:
    build:
      context: ./services/kotlin-service
    container_name: tracing-poc-kotlin-service
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: kotlin-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: trace-artifacts
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: kotlin-service
      OTEL_SERVICE_NAMESPACE: distributed-tracing-poc
      APP_ENV: docker
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      otel-collector:
        condition: service_started

  java-service:
    build:
      context: ./services/java-service
    container_name: tracing-poc-java-service
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: java-service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: tracing_poc
      POSTGRES_USER: tracing
      POSTGRES_USERNAME: tracing
      POSTGRES_PASSWORD: tracing
      KOTLIN_SERVICE_BASE_URL: http://kotlin-service:8081
      KOTLIN_SERVICE_TRACE_PATH: /api/v1/traces/process
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=docker,service.namespace=distributed-tracing-poc
      TRACING_SAMPLING_PROBABILITY: 1.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kotlin-service:
        condition: service_started
      otel-collector:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
